<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección Automática</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #d32f2f;
            margin: 20px 0;
        }

        /* Enllaç discret a la part inferior */
        .enlace-manual {
            display: block;
            margin-top: 25px;
            font-size: 11px;
            color: #999;
            text-decoration: none;
            opacity: 0.7;
        }

        .enlace-manual:hover {
            color: #666;
            text-decoration: underline;
            opacity: 1;
        }
    </style>
</head>

<body>

<div class="container">
    <div>Accedint a la Ràdio GL…</div>

    <div id="countdown">1</div>

    <!-- Enllaç manual discret -->
    <a id="enlace-manual"
       href="https://radiogl.github.io/mobile/"
       class="enlace-manual">
        Accés directe
    </a>
</div>

<script>
    let tiempoRestante = 1;

    const nuevaWeb = "https://radiogl.github.io/mobile/";

    const contadorElemento = document.getElementById('countdown');

    const cuentaAtras = setInterval(() => {
        tiempoRestante--;

        contadorElemento.textContent = tiempoRestante;

        if (tiempoRestante <= 0) {
            clearInterval(cuentaAtras);

            contadorElemento.textContent = "Redirigit...";

            window.location.href = nuevaWeb;

            setTimeout(() => {
                window.location.assign(nuevaWeb);
            }, 100);
        }
    }, 1000);
</script>

</body>
</html>
